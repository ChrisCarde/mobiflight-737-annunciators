; ******************************************************************************************
; MobiFlight custom device: Door / IRS annunciator panel
;
; Target board: LCDWIKI / QDtech "3.2inch ESP32-32E Display", SKU E32R32P
;   ESP32-WROOM-32E (classic ESP32-D0WD-V3, 4MB flash, NO PSRAM), CH340C USB-UART,
;   3.2" 240x320 IPS with an ST7789P3 controller, XPT2046 resistive touch.
;   Every pin below is a fixed PCB trace -- nothing here is a wiring choice.
;   Vendor reference: https://www.lcdwiki.com/3.2inch_ESP32-32E_Display
;
; The panel is native 240x320 portrait, rendered 320x240 landscape via setRotation(1).
; ******************************************************************************************

[env_annunciator]
build_flags =
	${env.build_flags}												; include standard build flags
	-DMF_CUSTOMDEVICE_SUPPORT=1										; Required for Custom Devices
	-DMF_CUSTOMDEVICE_HAS_UPDATE									; needed: drives the 1 Hz ALIGN blink and the self test
	-DMF_CUSTOMDEVICE_POLL_MS=20									; update() cadence; 50 Hz is plenty for lamps
	-I./src/src/MF_CustomDevice										; don't change this one!
	-I./Annunciator													; our sources
	-I./Annunciator/DoorPanel
	-I./Annunciator/IrsPanel
	-I./Annunciator/ElecPanel
	-I./Annunciator/McsPanel
	-I./Annunciator/AirPanel
	-I./Annunciator/FctlPanel
	-I./Annunciator/IsduPanel
build_src_filter =
	+<../Annunciator>
; Display libraries are per board -- see each env. The E32R32P's ST7789 is driven by
; TFT_eSPI; the C3248W535's AXS15231B is QSPI, which TFT_eSPI cannot drive at all.
custom_lib_deps_tft_espi =
	https://github.com/Bodmer/TFT_eSPI.git
custom_lib_deps_lgfx =
	lovyan03/LovyanGFX @ ^1.2.0
	moononournation/GFX Library for Arduino @ 1.6.8

; Upstream MobiFlight/MobiFlight-FirmwareSource has no ESP32 target at any released version.
; elral's fork carries ESP32 support on the ESP32_support branch -- see get_CoreFiles.py.
custom_core_firmware_source = https://github.com/elral/MobiFlight-FirmwareSource
custom_core_firmware_version = ESP32_support
; What the firmware REPORTS as its core version. The Connector parses it with System.Version,
; so it must be numeric -- a branch name makes adding a custom device throw. ESP32_support is
; 113 commits ahead of upstream 3.1.4 and 0 behind (GitHub compare, at 9299abc), so every
; feature through 3.1.4 is genuinely present and 3.1.4 is the truthful answer. Re-check this
; if the branch is ever rebased.
custom_core_firmware_base_version = 3.1.4
; The exact commit to build against. ESP32_support is a moving branch: without this,
; every build pulls whatever landed upstream that day and core drift is indistinguishable
; from a bug in our own change. 9299abc is 'Merge branch MobiFlight:main into
; ESP32_support', 2026-07-28. Clear the key to follow the branch head again; bump it
; deliberately, and re-run tools/check_definitions.py afterwards.
custom_core_firmware_commit = 9299abceca30db5e2dce166baa645ea36faef64a
custom_source_folder = Annunciator
custom_community_project = Annunciator
custom_zip_filename = ${env_annunciator.custom_community_project}

; ------------------------------------------------------------------------------------------
; ESP32-S3 DevKitC-1, native USB CDC (VID 303A / PID 1001)
; ------------------------------------------------------------------------------------------
[env:annunciator_e32r32p]
platform = espressif32
board = esp32dev
framework = arduino
lib_ldf_mode = deep+
build_flags =
	${env_annunciator.build_flags}									; don't change this one!
	-DANNUN_BOARD_E32R32P											; picks the board in Annunciator/Board.h:
																	; screen size, backlight pin, display backend
	'-DMOBIFLIGHT_TYPE="Annunciator E32R32P"'						; must match "MobiFlightType" in the .board.json
	'-DMOBIFLIGHT_NAME="Annunciator"'							; default name in the settings dialog
	-DMEMLEN_CONFIG=1496											; max. size for config stored in EEPROM
	-DMEMLEN_NAMES_BUFFER=1000										; max. size for configBuffer (input names only)
	-DMF_MAX_DEVICEMEM=2000											; max. memory size for devices
	; NO -DARDUINO_USB_MODE / -DARDUINO_USB_CDC_ON_BOOT here. A classic ESP32 has no native
	; USB (this board talks through a CH340C), and those flags make Serial expand to the
	; non-existent HWCDCSerial -- a hard compile error, which is the failure mode we want.
	-DBUFFER_LENGTH=I2C_BUFFER_LENGTH
	; --- TFT_eSPI is configured entirely through -D, User_Setup.h is never edited ---
	-DUSER_SETUP_LOADED=1
	-DST7789_DRIVER=1										; NOT ST7789_2_DRIVER: that variant's canned init
															; hard-codes a 240x240 window and skips porch/power/gamma
	; 240x320 is the panel's NATIVE portrait size and is load bearing. TFT_eSPI derives
	; CGRAM_OFFSET from these two numbers (ST7789_Defines.h:10-46); 240x320 matches none of
	; its offset cases, which is what we want. Changing them shifts the whole image.
	-DTFT_WIDTH=240
	-DTFT_HEIGHT=320
	; Fixed traces on the E32R32P. 14/13/12/15 are exactly the HSPI IOMUX pins, which is why
	; USE_HSPI_PORT below matters: on classic ESP32 TFT_eSPI defaults to VSPI, and VSPI would
	; route these through the slower GPIO matrix instead of the direct IOMUX path.
	-DTFT_MOSI=13
	-DTFT_SCLK=14
	-DTFT_MISO=12											; shared with the XPT2046 touch controller
	-DTFT_CS=15
	-DTFT_DC=2
	-DTFT_RST=-1											; LCD reset is tied to the ESP32 EN pin, not a
															; GPIO. TFT_eSPI issues a software reset instead.
	-DUSE_HSPI_PORT
	; TFT_BL is deliberately NOT defined. TFT_eSPI would drive the backlight on inside init(),
	; which is exactly when the ST7789 init sequence paints the screen red -- PanelGfx holds
	; the backlight off across init() to hide that. The backlight stays under our control.
	; ST7789 defaults to SPI mode 3 (TFT_eSPI.h:130-137) where ILI9341 used mode 0. Pinned
	; explicitly so that trying mode 0 is a one-token change if the panel comes up blank or torn.
	-DTFT_SPI_MODE=SPI_MODE3
	-DLOAD_GLCD=1
	-DLOAD_GFXFF=1
	-DSMOOTH_FONT=1
	-DSPI_FREQUENCY=40000000								; if blank/noisy, try 27000000 first
	-DSPI_READ_FREQUENCY=20000000
	; Colour order is BGR on this panel -- MEASURED on a real E32R32P: with TFT_eSPI's ST7789
	; default (RGB) the amber door lamps rendered blue and the blue ground-power lamp amber.
	; (Reasoning from LCDWIKI's MADCTL value predicted RGB; the hardware disagreed, and the
	; hardware wins.) Inversion is correct at the default -- the background renders dark.
	-DTFT_RGB_ORDER=TFT_BGR
;	-DTFT_INVERSION_OFF
	; Touch: an XPT2046 on the display SPI bus, chip select GPIO 33. Annunciator/Touch.cpp
	; reads it through TFT_eSPI's raw calls, which exist only with TOUCH_CS defined. The pen
	; interrupt (GPIO 36) is not needed: the panel polls.
	-DTOUCH_CS=33
	-DSPI_TOUCH_FREQUENCY=2500000
build_unflags =
	-Wdeprecated-declarations
build_src_filter =
	${env.build_src_filter}											; don't change this one!
	${env_annunciator.build_src_filter}								; don't change this one!
	-<../Annunciator/PanelGfxLGFX.cpp>								; the other board's backend
	-<../Annunciator/TouchAXS15231B.cpp>
lib_deps =
	${env.lib_deps}													; don't change this one!
	${env.custom_lib_deps_ESP32}									; don't change this one!
	${env_annunciator.custom_lib_deps_tft_espi}						; this board's display library
monitor_speed = 115200												; don't change this one!
; The E32R32P's CH340C throws "Invalid head of packet" at 460800 -- PlatformIO's esp32dev
; default -- but reads 4MB cleanly at 230400 (measured on real hardware).
upload_speed = 230400
extra_scripts =
	${env.extra_scripts}											; don't change this one!
custom_core_firmware_source = ${env_annunciator.custom_core_firmware_source}	; don't change this one!
custom_core_firmware_version = ${env_annunciator.custom_core_firmware_version}	; don't change this one!
custom_core_firmware_commit = ${env_annunciator.custom_core_firmware_commit}	; don't change this one!
custom_core_firmware_base_version = ${env_annunciator.custom_core_firmware_base_version}	; don't change this one!
custom_community_project = ${env_annunciator.custom_community_project}			; don't change this one!
custom_source_folder = ${env_annunciator.custom_source_folder}					; don't change this one!
custom_zip_filename = ${env_annunciator.custom_zip_filename}					; don't change this one!

; ------------------------------------------------------------------------------------------
; Caturda C3248W535 (sold also as Guition / JCZN JC3248W535EN)
;   ESP32-S3-WROOM-1 N16R8: 16MB flash, 8MB OPI PSRAM, native USB-Serial-JTAG.
;   3.5" 320x480 IPS with an AXS15231B over QSPI, drawn as 480x320 landscape. Capacitive
;   touch is the same AXS15231B again, on I2C. Every pin is a fixed PCB trace; they live in
;   Annunciator/Board.h rather than here, because the display library takes them as
;   arguments rather than as -D flags.
;
;   TFT_eSPI cannot drive this panel -- it has no quad-SPI transport and no AXS15231B
;   driver. Pixels are drawn by LovyanGFX into a full-screen sprite in PSRAM, and that
;   sprite is blitted to the panel by Arduino_GFX, which is the proven QSPI path for this
;   display.
;
;   Arduino_GFX is pinned exactly, and the panel's init sequence is passed explicitly in
;   PanelGfxLGFX.cpp rather than taken as the library's default. Both matter: 1.6.0 and
;   earlier do not build against Arduino-ESP32 core 3.x at all (their SPI bus calls the
;   core's old spiFrequencyToClockDiv), while from 1.6.4 the default AXS15231B sequence is
;   a different panel's -- a 180x640 LilyGO -- so taking the default gives a blank screen.
; ------------------------------------------------------------------------------------------
[env:annunciator_c3248w535]
platform = espressif32
board = esp32-s3-devkitc-1										; no vendor board id exists for this module
framework = arduino
lib_ldf_mode = deep+
board_build.arduino.memory_type = qio_opi						; QIO flash + OPI PSRAM. Wrong here = no PSRAM = black screen
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.f_flash = 80000000L									; NOT the vendor manual's 120MHz: that is an experimental
																; IDF mode whose timing drifts with temperature
board_build.partitions = huge_app.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
build_flags =
	${env_annunciator.build_flags}									; don't change this one!
	-DANNUN_BOARD_C3248W535											; picks the board in Annunciator/Board.h
	'-DMOBIFLIGHT_TYPE="Annunciator C3248W535"'						; must match "MobiFlightType" in the .board.json
	'-DMOBIFLIGHT_NAME="Annunciator 35"'							; default name in the settings dialog
	-DMEMLEN_CONFIG=1496											; must equal "EEPROMSize" in the .board.json
	-DMEMLEN_NAMES_BUFFER=1000
	-DMF_MAX_DEVICEMEM=2000
	-DBOARD_HAS_PSRAM												; the 480x320 framebuffer is 300KB and cannot be internal
	-DARDUINO_USB_MODE=1											; hardware CDC + JTAG, as the vendor's own settings use
	-DARDUINO_USB_CDC_ON_BOOT=1										; Serial goes to USB; there is no bridge chip
	-DBUFFER_LENGTH=I2C_BUFFER_LENGTH
build_unflags =
	-Wdeprecated-declarations
build_src_filter =
	${env.build_src_filter}											; don't change this one!
	${env_annunciator.build_src_filter}								; don't change this one!
	-<../Annunciator/PanelGfxTftESPI.cpp>							; the other board's backend
	-<../Annunciator/TouchXPT2046.cpp>
lib_deps =
	${env.lib_deps}													; don't change this one!
	${env.custom_lib_deps_ESP32}									; don't change this one!
	${env_annunciator.custom_lib_deps_lgfx}							; this board's display libraries
monitor_speed = 115200												; don't change this one!
upload_speed = 921600
extra_scripts =
	${env.extra_scripts}											; don't change this one!
custom_core_firmware_source = ${env_annunciator.custom_core_firmware_source}	; don't change this one!
custom_core_firmware_version = ${env_annunciator.custom_core_firmware_version}	; don't change this one!
custom_core_firmware_commit = ${env_annunciator.custom_core_firmware_commit}	; don't change this one!
custom_core_firmware_base_version = ${env_annunciator.custom_core_firmware_base_version}	; don't change this one!
custom_community_project = ${env_annunciator.custom_community_project}			; don't change this one!
custom_source_folder = ${env_annunciator.custom_source_folder}					; don't change this one!
custom_zip_filename = ${env_annunciator.custom_zip_filename}					; don't change this one!

; ------------------------------------------------------------------------------------------
; Hardware bring-up probe for the C3248W535 -- not firmware, and not in default_envs.
; Flash it before the real thing when a board is new or a panel comes up wrong: it checks
; PSRAM, the backlight, the touch bus, the display init and the touch orientation, one at a
; time, over serial. See tools/bringup/bringup.cpp.
; ------------------------------------------------------------------------------------------
[env:bringup_c3248w535]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
lib_ldf_mode = deep+
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.f_flash = 80000000L
board_build.partitions = huge_app.csv
board_upload.flash_size = 16MB
build_flags =
	-DANNUN_BOARD_C3248W535											; the pin map comes from Board.h
	-I./Annunciator
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter =
	-<*>															; none of the MobiFlight core
	+<../tools/bringup>
lib_deps =
	${env_annunciator.custom_lib_deps_lgfx}
monitor_speed = 115200
upload_speed = 921600
; None of the shared scripts apply: this is not MobiFlight firmware, so it needs no core
; checkout, no version stamping and no Connector package.
extra_scripts =
