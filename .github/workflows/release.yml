# Builds both boards and publishes what a person installs from: the Connector package, a full
# flash image per board, the 3.2in launcher and the licences on the release -- exactly what
# `pio run` leaves in _dist/ -- and the browser installer in _site/ on GitHub Pages.
#
#   Release:  push a tag   git tag v0.1.0 && git push origin v0.1.0
#   Dry run:  Actions -> Release -> Run workflow. Builds the same set as a downloadable
#             artifact and publishes nothing.
#
# Pages needs two repository settings, once: Settings -> Pages -> Source: GitHub Actions; and
# Settings -> Environments -> github-pages -> add a deployment tag rule "v*", because that
# environment only accepts deployments from the default branch until told otherwise.
#
# The tag is the version: v0.1.0 builds as VERSION=0.1.0, which is stamped into the firmware,
# the file names and the board definitions (get_version.py, copy_fw_files.py).

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The platform and every library are pinned in Annunciator_platformio.ini, so the cache
      # only saves downloading them again; it cannot change what gets built.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini', 'Annunciator/Annunciator_platformio.ini') }}

      - name: Install PlatformIO
        run: pip install platformio==6.1.19

      - name: Set the version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then v="${GITHUB_REF_NAME#v}"; else v=0.0.1; fi
          # The Connector reads it with System.Version: two to four dotted numbers, nothing else.
          if ! echo "$v" | grep -Eq '^[0-9]+(\.[0-9]+){1,3}$'; then
            echo "::error::$GITHUB_REF_NAME is not a version tag like v0.1.0"; exit 1
          fi
          echo "VERSION=$v" >> "$GITHUB_ENV"
          # __DATE__ and __TIME__ are compiled in. Taking them from the commit rather than the
          # clock means the same tag always builds to the same bytes.
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Build and package both boards
        run: pio run

      # Firmware flags against the board and device definitions, and the package against both:
      # every definition current, every board's firmware in the zip, a full image per board.
      - name: Check the definitions and the package
        run: python tools/check_definitions.py

      # Gated on the event, not the ref: a manual run started from a tag is still a dry run.
      - name: Upload the build (dry run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: annunciator-${{ env.VERSION }}
          path: |
            _dist/
            _site/
          if-no-files-found: error

      - name: Publish the release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: _dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: >
            Firmware and MobiFlight definitions for both boards. Follow the
            [setup guide](https://github.com/${{ github.repository }}#setup): it installs the
            firmware from the [browser installer](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/)
            and says which of the files below you need for your board.

      - name: Stage the web installer
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/

  # Its own job, after the release: Pages deploys through an environment, and a failure here
  # leaves the release itself published.
  pages:
    if: github.event_name == 'push'
    needs: release
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
